<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md antialiased pb-[100px] pt-[64px]">
<!-- TopAppBar -->
<header class="bg-white dark:bg-slate-900 border-b border-slate-100 dark:border-slate-800 docked full-width top-0 flat no shadows flex justify-between items-center px-5 h-16 w-full fixed z-50">

</button>
<h1 class="font-['Manrope'] text-sm font-semibold tracking-tight text-lg font-bold text-blue-700 dark:text-blue-300">Recovery Hub</h1>
<button aria-label="Profile" class="text-blue-700 dark:text-blue-400 hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors active:opacity-70 transition-all duration-200 p-2 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined">account_circle</span>
</button>
</header>

<div class="w-full aspect-[2/1] rounded-2xl overflow-hidden bg-secondary-container/30 flex items-center justify-center">

<p class="font-body-md text-body-md text-on-surface-variant mt-1">Select the information you want to include in your secure report.</p>
</div>
<!-- Toggles Container (Bento Style Card) -->

<!-- Toggle 1 -->
<div class="flex items-center justify-between group cursor-pointer">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full bg-secondary-container flex items-center justify-center text-primary">
<span class="material-symbols-outlined fill">clinical_notes</span>
</div>
<span class="font-label-md text-label-md text-on-surface">Full Recovery Summary</span>
</div>
<!-- Toggle Switch ON -->
<div class="w-[52px] h-[32px] rounded-full bg-primary p-1 flex items-center justify-end transition-colors shadow-inner">
<div class="w-6 h-6 rounded-full bg-white shadow-sm"></div>
</div>
</div>
<div class="w-full h-px bg-outline-variant/20"></div>
<!-- Toggle 2 -->
<div class="flex items-center justify-between group cursor-pointer">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full bg-secondary-container flex items-center justify-center text-primary">
<span class="material-symbols-outlined fill">history</span>
</div>
<span class="font-label-md text-label-md text-on-surface">Symptom History (Last 7 Days)</span>
</div>
<!-- Toggle Switch ON -->
<div class="w-[52px] h-[32px] rounded-full bg-primary p-1 flex items-center justify-end transition-colors shadow-inner">
<div class="w-6 h-6 rounded-full bg-white shadow-sm"></div>
</div>
</div>
<div class="w-full h-px bg-outline-variant/20"></div>

<div class="w-10 h-10 rounded-full bg-secondary-container flex items-center justify-center text-primary">
<span class="material-symbols-outlined fill">medication</span>
</div>
<span class="font-label-md text-label-md text-on-surface">Current Medication List</span>
</div>
<!-- Toggle Switch ON -->
<div class="w-[52px] h-[32px] rounded-full bg-primary p-1 flex items-center justify-end transition-colors shadow-inner">
<div class="w-6 h-6 rounded-full bg-white shadow-sm"></div>
</div>
</div>

<button class="w-full h-[56px] rounded-2xl bg-primary text-on-primary font-label-md text-label-md flex items-center justify-center gap-2 hover:bg-primary/90 transition-colors shadow-[0_4px_20px_rgba(0,82,204,0.08)]">
<span class="material-symbols-outlined">picture_as_pdf</span>
                Generate Secure PDF Report
            </button>
<button class="w-full h-[56px] rounded-2xl bg-secondary-container text-primary font-label-md text-label-md flex items-center justify-center gap-2 hover:bg-secondary-container/80 transition-colors">
<span class="material-symbols-outlined">mail</span>

</div>

<!-- Item 2: Log (Inactive) -->

<span class="material-symbols-outlined mb-1">medical_services</span>
<span class="font-['Manrope'] text-[10px] font-medium uppercase tracking-wider text-center">Log</span>
</button>

<span class="material-symbols-outlined mb-1">description</span>
