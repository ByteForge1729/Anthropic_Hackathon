<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>PDF Upload - Recovery Hub</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Manrope:wght@600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "on-background": "#191b23",
                    "secondary-container": "#d9e3f2",
                    "on-secondary-fixed-variant": "#3e4853",
                    "secondary-fixed-dim": "#bdc7d6",
                    "secondary-fixed": "#d9e3f2",
                    "outline": "#737685",
                    "surface-variant": "#e1e2ec",
                    "on-surface": "#191b23",
                    "on-secondary-fixed": "#131c27",
                    "surface-container-high": "#e7e7f2",
                    "inverse-primary": "#b2c5ff",
                    "background": "#faf8ff",
                    "surface-container-low": "#f3f3fd",
                    "surface-bright": "#faf8ff",
                    "primary-container": "#0052cc",
                    "on-error-container": "#93000a",
                    "outline-variant": "#c3c6d6",
                    "surface-container": "#ededf8",
                    "primary": "#003d9b",
                    "on-tertiary-fixed-variant": "#812800",
                    "primary-fixed-dim": "#b2c5ff",
                    "on-primary-fixed-variant": "#0040a2",
                    "error": "#ba1a1a",
                    "secondary": "#555f6c",
                    "error-container": "#ffdad6",
                    "on-primary": "#ffffff",
                    "on-secondary": "#ffffff",
                    "surface-container-highest": "#e1e2ec",
                    "on-secondary-container": "#5b6572",
                    "surface-container-lowest": "#ffffff",
                    "tertiary-fixed": "#ffdbcf",
                    "surface-dim": "#d9d9e4",
                    "inverse-on-surface": "#f0f0fb",
                    "tertiary-fixed-dim": "#ffb59b",
                    "on-tertiary-fixed": "#380d00",
                    "surface-tint": "#0c56d0",
                    "on-tertiary": "#ffffff",
                    "on-primary-container": "#c4d2ff",
                    "on-surface-variant": "#434654",
                    "surface": "#faf8ff",
                    "tertiary-container": "#a33500",
                    "on-primary-fixed": "#001848",
                    "on-error": "#ffffff",
                    "primary-fixed": "#dae2ff",
                    "on-tertiary-container": "#ffc6b2",
                    "inverse-surface": "#2e3038",
                    "tertiary": "#7b2600"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "edge-margin": "20px",
                    "stack-gap": "16px",
                    "section-padding": "24px",
                    "inline-gap": "12px"
            },
            "fontFamily": {
                    "headline-lg": [
                            "Manrope"
                    ],
                    "label-md": [
                            "Inter"
                    ],
                    "body-lg": [
                            "Inter"
                    ],
                    "body-md": [
                            "Inter"
                    ],
                    "headline-md": [
                            "Manrope"
                    ],
                    "subtext-sm": [
                            "Inter"
                    ]
            },
            "fontSize": {
                    "headline-lg": [
                            "32px",
                            {
                                    "lineHeight": "40px",
                                    "letterSpacing": "-0.02em",
                                    "fontWeight": "700"
                            }
                    ],
                    "label-md": [
                            "14px",
                            {
                                    "lineHeight": "20px",
                                    "fontWeight": "500"
                            }
                    ],
                    "body-lg": [
                            "18px",
                            {
                                    "lineHeight": "28px",
                                    "fontWeight": "400"
                            }
                    ],
                    "body-md": [
                            "16px",
                            {
                                    "lineHeight": "24px",
                                    "fontWeight": "400"
                            }
                    ],
                    "headline-md": [
                            "24px",
                            {
                                    "lineHeight": "32px",
                                    "letterSpacing": "-0.01em",
                                    "fontWeight": "600"
                            }
                    ],
                    "subtext-sm": [
                            "13px",
                            {
                                    "lineHeight": "18px",
                                    "fontWeight": "400"
                            }
                    ]
            }
        },
        },
      }
    </script>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col antialiased">
<!-- Top Navigation (Transactional intent, suppressed global nav rules apply, so custom transactional header) -->
<header class="flex justify-between items-center px-edge-margin h-16 w-full border-b border-surface-variant bg-surface">
<button aria-label="Go Back" class="text-primary hover:bg-surface-container-highest transition-colors rounded-full p-2 -ml-2 active:opacity-70">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<span class="font-label-md text-label-md text-on-surface-variant">Step 2 of 2</span>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col px-edge-margin py-section-padding gap-stack-gap max-w-2xl mx-auto w-full">
<div class="mb-4 text-center sm:text-left">
<h1 class="font-headline-lg text-headline-lg text-primary mb-2">Upload Discharge Papers</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Scan or upload your hospital documents. Our AI will simplify the instructions for you.</p>
</div>
<!-- Main Drop Zone -->
<div class="relative w-full h-80 rounded-[16px] border-2 border-dashed border-primary bg-secondary-container/20 hover:bg-secondary-container/40 transition-colors flex flex-col items-center justify-center p-6 text-center group cursor-pointer">
<div class="w-20 h-20 bg-surface rounded-full flex items-center justify-center mb-6 shadow-sm group-hover:scale-105 transition-transform">
<span class="material-symbols-outlined text-[40px] text-primary" style="font-variation-settings: 'FILL' 1;">upload_file</span>
</div>
<button class="bg-surface text-primary border border-outline-variant hover:border-primary font-label-md text-label-md py-4 px-8 rounded-[16px] h-[56px] transition-colors shadow-sm flex items-center gap-2">
<span class="material-symbols-outlined">add</span>
                 Select File from Device
            </button>
<p class="mt-4 font-subtext-sm text-subtext-sm text-on-surface-variant">Supported formats: PDF, JPG, PNG (Max 10MB)</p>
<input aria-label="File Upload Input" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer" type="file"/>
</div>
<!-- Security Badge -->
<div class="mt-auto pt-8 flex items-center justify-center gap-2 text-on-surface-variant">
<span class="material-symbols-outlined text-[18px]">lock</span>
<p class="font-subtext-sm text-subtext-sm">Your data is encrypted and HIPAA-compliant.</p>
</div>
<div class="w-full mt-4">
<button class="w-full bg-primary text-on-primary font-label-md text-label-md h-[56px] rounded-[16px] hover:bg-on-primary-fixed-variant transition-colors flex items-center justify-center opacity-50 cursor-not-allowed">
                 Continue
             </button>
</div>
</main>
</body></html>
