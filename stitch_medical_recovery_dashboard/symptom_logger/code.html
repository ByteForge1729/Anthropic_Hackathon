<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Symptom Logger - Recovery Hub</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Manrope:wght@600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-family: 'Material Symbols Outlined';
            font-weight: normal;
            font-style: normal;
            font-size: 24px;
            line-height: 1;
            letter-spacing: normal;
            text-transform: none;
            display: inline-block;
            white-space: nowrap;
            word-wrap: normal;
            direction: ltr;
            -webkit-font-feature-settings: 'liga';
            -webkit-font-smoothing: antialiased;
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-background": "#191b23",
                        "secondary-container": "#d9e3f2",
                        "on-secondary-fixed-variant": "#3e4853",
                        "secondary-fixed-dim": "#bdc7d6",
                        "secondary-fixed": "#d9e3f2",
                        "outline": "#737685",
                        "surface-variant": "#e1e2ec",
                        "on-surface": "#191b23",
                        "on-secondary-fixed": "#131c27",
                        "surface-container-high": "#e7e7f2",
                        "inverse-primary": "#b2c5ff",
                        "background": "#faf8ff",
                        "surface-container-low": "#f3f3fd",
                        "surface-bright": "#faf8ff",
                        "primary-container": "#0052cc",
                        "on-error-container": "#93000a",
                        "outline-variant": "#c3c6d6",
                        "surface-container": "#ededf8",
                        "primary": "#003d9b",
                        "on-tertiary-fixed-variant": "#812800",
                        "primary-fixed-dim": "#b2c5ff",
                        "on-primary-fixed-variant": "#0040a2",
                        "error": "#ba1a1a",
                        "secondary": "#555f6c",
                        "error-container": "#ffdad6",
                        "on-primary": "#ffffff",
                        "on-secondary": "#ffffff",
                        "surface-container-highest": "#e1e2ec",
                        "on-secondary-container": "#5b6572",
                        "surface-container-lowest": "#ffffff",
                        "tertiary-fixed": "#ffdbcf",
                        "surface-dim": "#d9d9e4",
                        "inverse-on-surface": "#f0f0fb",
                        "tertiary-fixed-dim": "#ffb59b",
                        "on-tertiary-fixed": "#380d00",
                        "surface-tint": "#0c56d0",
                        "on-tertiary": "#ffffff",
                        "on-primary-container": "#c4d2ff",
                        "on-surface-variant": "#434654",
                        "surface": "#faf8ff",
                        "tertiary-container": "#a33500",
                        "on-primary-fixed": "#001848",
                        "on-error": "#ffffff",
                        "primary-fixed": "#dae2ff",
                        "on-tertiary-container": "#ffc6b2",
                        "inverse-surface": "#2e3038",
                        "tertiary": "#7b2600"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "edge-margin": "20px",
                        "stack-gap": "16px",
                        "section-padding": "24px",
                        "inline-gap": "12px"
                    },
                    "fontFamily": {
                        "headline-lg": ["Manrope"],
                        "label-md": ["Inter"],
                        "body-lg": ["Inter"],
                        "body-md": ["Inter"],
                        "headline-md": ["Manrope"],
                        "subtext-sm": ["Inter"]
                    },
                    "fontSize": {
                        "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                        "label-md": ["14px", {"lineHeight": "20px", "fontWeight": "500"}],
                        "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
                        "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                        "headline-md": ["24px", {"lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                        "subtext-sm": ["13px", {"lineHeight": "18px", "fontWeight": "400"}]
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md antialiased">
<!-- TopAppBar -->
<header class="bg-white dark:bg-slate-900 border-b border-slate-100 dark:border-slate-800 flex justify-between items-center px-5 h-16 w-full sticky top-0 z-40">
<button aria-label="Go back" class="text-blue-700 dark:text-blue-400 hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors active:opacity-70 transition-all duration-200 p-2 -ml-2 rounded-full">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="text-lg font-bold text-blue-700 dark:text-blue-300 tracking-tight font-['Manrope']">Recovery Hub</h1>
<button aria-label="Account" class="text-blue-700 dark:text-blue-400 hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors active:opacity-70 transition-all duration-200 p-2 -mr-2 rounded-full">
<span class="material-symbols-outlined" data-icon="account_circle">account_circle</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow pb-24 pt-6 px-edge-margin flex flex-col gap-8 max-w-2xl mx-auto w-full">
<!-- Header Section -->
<section class="flex flex-col gap-2">
<h2 class="font-headline-lg text-headline-lg text-on-background text-center">How are you feeling right now?</h2>
<p class="font-body-md text-body-md text-on-surface-variant text-center">Log your current status to help track your recovery progress.</p>
</section>
<!-- Visual Scale Section (Bento Card Style) -->
<section class="bg-surface-container-lowest border border-surface-variant rounded-[16px] p-edge-margin flex flex-col gap-stack-gap">
<div class="flex justify-between items-center w-full px-2">
<!-- Very Poor -->
<button aria-label="Very Poor" class="flex flex-col items-center gap-2 group transition-all duration-200 hover:scale-105 active:scale-95">
<span class="material-symbols-outlined text-[36px] text-surface-variant group-hover:text-primary-fixed-dim transition-colors" data-icon="sentiment_very_dissatisfied" style="font-variation-settings: 'FILL' 1;">sentiment_very_dissatisfied</span>
</button>
<!-- Poor -->
<button aria-label="Poor" class="flex flex-col items-center gap-2 group transition-all duration-200 hover:scale-105 active:scale-95">
<span class="material-symbols-outlined text-[36px] text-surface-variant group-hover:text-inverse-primary transition-colors" data-icon="sentiment_dissatisfied" style="font-variation-settings: 'FILL' 1;">sentiment_dissatisfied</span>
</button>
<!-- Neutral (Active/Selected State Example) -->
<button aria-label="Neutral" class="flex flex-col items-center gap-2 group transition-all duration-200 hover:scale-105 active:scale-95 relative">
<div class="absolute inset-0 bg-primary-fixed opacity-50 rounded-full blur-md -z-10"></div>
<span class="material-symbols-outlined text-[42px] text-primary-container transition-colors" data-icon="sentiment_neutral" style="font-variation-settings: 'FILL' 1;">sentiment_neutral</span>
</button>
<!-- Good -->
<button aria-label="Good" class="flex flex-col items-center gap-2 group transition-all duration-200 hover:scale-105 active:scale-95">
<span class="material-symbols-outlined text-[36px] text-surface-variant group-hover:text-primary-container transition-colors" data-icon="sentiment_satisfied" style="font-variation-settings: 'FILL' 1;">sentiment_satisfied</span>
</button>
<!-- Great -->
<button aria-label="Great" class="flex flex-col items-center gap-2 group transition-all duration-200 hover:scale-105 active:scale-95">
<span class="material-symbols-outlined text-[36px] text-surface-variant group-hover:text-primary transition-colors" data-icon="sentiment_very_satisfied" style="font-variation-settings: 'FILL' 1;">sentiment_very_satisfied</span>
</button>
</div>
<div class="flex justify-between font-subtext-sm text-subtext-sm text-on-surface-variant px-1">
<span>Very Poor</span>
<span>Great</span>
</div>
</section>
<!-- Checklist Section -->
<section class="bg-secondary-fixed border border-secondary-fixed-dim rounded-[16px] p-edge-margin flex flex-col gap-stack-gap">
<h3 class="font-headline-md text-headline-md text-on-background">Any specific symptoms?</h3>
<div class="flex flex-wrap gap-inline-gap">
<!-- Active Chip -->
<button class="bg-primary text-on-primary font-label-md text-label-md px-5 py-3 rounded-full transition-colors active:opacity-80">
                    Pain
                </button>
<!-- Inactive Chip -->
<button class="bg-surface-container-lowest text-on-surface font-label-md text-label-md px-5 py-3 rounded-full border border-surface-variant transition-colors hover:bg-surface-container-high active:opacity-80">
                    Fever
                </button>
<!-- Active Chip -->
<button class="bg-primary text-on-primary font-label-md text-label-md px-5 py-3 rounded-full transition-colors active:opacity-80">
                    Fatigue
                </button>
<!-- Inactive Chip -->
<button class="bg-surface-container-lowest text-on-surface font-label-md text-label-md px-5 py-3 rounded-full border border-surface-variant transition-colors hover:bg-surface-container-high active:opacity-80">
                    Dizziness
                </button>
<!-- Inactive Chip -->
<button class="bg-surface-container-lowest text-on-surface font-label-md text-label-md px-5 py-3 rounded-full border border-surface-variant transition-colors hover:bg-surface-container-high active:opacity-80">
                    Shortness of Breath
                </button>
</div>
</section>
<!-- Notes Section -->
<section class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface-variant ml-1" for="notes">Anything else you'd like to note?</label>
<textarea class="w-full bg-surface-container-lowest border border-outline-variant text-on-surface rounded-[16px] p-4 font-body-md text-body-md focus:border-primary focus:ring-1 focus:ring-primary transition-colors resize-none" id="notes" placeholder="Describe any other feelings or observations..." rows="4"></textarea>
</section>
<!-- CTA Section -->
<section class="mt-auto pt-4">
<button class="w-full h-[56px] bg-primary text-on-primary font-label-md text-label-md rounded-[16px] shadow-[0_4px_20px_rgba(0,82,204,0.08)] hover:bg-primary-container active:opacity-90 transition-all duration-200 flex items-center justify-center gap-2">
<span class="material-symbols-outlined" data-icon="save">save</span>
                Save Log
            </button>
</section>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-2 h-20 bg-white dark:bg-slate-900 border-t border-slate-100 dark:border-slate-800 rounded-t-2xl shadow-[0_-4px_20px_rgba(0,82,204,0.06)] md:hidden">
<!-- Inactive: Home -->
<a class="flex flex-col items-center justify-center text-slate-400 dark:text-slate-500 px-4 py-2 hover:text-blue-600 dark:hover:text-blue-200 active:scale-95 transition-transform duration-150" href="#">
<span class="material-symbols-outlined mb-1" data-icon="grid_view">grid_view</span>
<span class="font-['Manrope'] text-[10px] font-medium uppercase tracking-wider">Home</span>
</a>
<!-- Active: Log -->
<a class="flex flex-col items-center justify-center bg-blue-50 dark:bg-blue-900/30 text-blue-700 dark:text-blue-300 rounded-2xl px-4 py-2 hover:text-blue-600 dark:hover:text-blue-200 active:scale-95 transition-transform duration-150" href="#">
<span class="material-symbols-outlined mb-1" data-icon="medical_services" style="font-variation-settings: 'FILL' 1;">medical_services</span>
<span class="font-['Manrope'] text-[10px] font-medium uppercase tracking-wider">Log</span>
</a>
<!-- Inactive: Share -->
<a class="flex flex-col items-center justify-center text-slate-400 dark:text-slate-500 px-4 py-2 hover:text-blue-600 dark:hover:text-blue-200 active:scale-95 transition-transform duration-150" href="#">
<span class="material-symbols-outlined mb-1" data-icon="share">share</span>
<span class="font-['Manrope'] text-[10px] font-medium uppercase tracking-wider">Share</span>
</a>
<!-- Inactive: Docs -->
<a class="flex flex-col items-center justify-center text-slate-400 dark:text-slate-500 px-4 py-2 hover:text-blue-600 dark:hover:text-blue-200 active:scale-95 transition-transform duration-150" href="#">
<span class="material-symbols-outlined mb-1" data-icon="description">description</span>
<span class="font-['Manrope'] text-[10px] font-medium uppercase tracking-wider">Docs</span>
</a>
</nav>
<!-- Desktop Sidebar (Hidden on mobile, matching semantic intent for Log) -->
<nav class="hidden md:flex flex-col fixed left-0 top-16 bottom-0 w-64 bg-white dark:bg-slate-900 border-r border-slate-100 dark:border-slate-800 p-4 gap-2 z-30 shadow-[4px_0_20px_rgba(0,82,204,0.02)]">
<a class="flex items-center gap-3 text-slate-500 dark:text-slate-400 px-4 py-3 rounded-xl hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors" href="#">
<span class="material-symbols-outlined" data-icon="grid_view">grid_view</span>
<span class="font-['Manrope'] text-sm font-semibold tracking-tight">Home</span>
</a>
<a class="flex items-center gap-3 bg-blue-50 dark:bg-blue-900/30 text-blue-700 dark:text-blue-400 px-4 py-3 rounded-xl transition-colors border-l-4 border-blue-700" href="#">
<span class="material-symbols-outlined" data-icon="medical_services" style="font-variation-settings: 'FILL' 1;">medical_services</span>
<span class="font-['Manrope'] text-sm font-semibold tracking-tight">Log</span>
</a>
<a class="flex items-center gap-3 text-slate-500 dark:text-slate-400 px-4 py-3 rounded-xl hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors" href="#">
<span class="material-symbols-outlined" data-icon="share">share</span>
<span class="font-['Manrope'] text-sm font-semibold tracking-tight">Share</span>
</a>
<a class="flex items-center gap-3 text-slate-500 dark:text-slate-400 px-4 py-3 rounded-xl hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors" href="#">
<span class="material-symbols-outlined" data-icon="description">description</span>
<span class="font-['Manrope'] text-sm font-semibold tracking-tight">Docs</span>
</a>
</nav>
<!-- Adjust main layout for desktop sidebar -->
<style>
        @media (min-width: 768px) {
            main {
                margin-left: 16rem; /* 64 * 0.25rem = 16rem */
                max-width: calc(100% - 16rem);
            }
        }
    </style>
</body></html>
