<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Language Onboarding</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "on-background": "#191b23",
                      "secondary-container": "#d9e3f2",

                      "secondary-fixed-dim": "#bdc7d6",
                      "secondary-fixed": "#d9e3f2",
                      "outline": "#737685",

                      "on-surface": "#191b23",
                      "on-secondary-fixed": "#131c27",
                      "surface-container-high": "#e7e7f2",
                      "inverse-primary": "#b2c5ff",
                      "background": "#faf8ff",
                      "surface-container-low": "#f3f3fd",
                      "surface-bright": "#faf8ff",
                      "primary-container": "#0052cc",
                      "on-error-container": "#93000a",
                      "outline-variant": "#c3c6d6",
                      "surface-container": "#ededf8",
                      "primary": "#003d9b",
                      "on-tertiary-fixed-variant": "#812800",
                      "primary-fixed-dim": "#b2c5ff",
                      "on-primary-fixed-variant": "#0040a2",
                      "error": "#ba1a1a",
                      "secondary": "#555f6c",
                      "error-container": "#ffdad6",
                      "on-primary": "#ffffff",
                      "on-secondary": "#ffffff",
                      "surface-container-highest": "#e1e2ec",
                      "on-secondary-container": "#5b6572",
                      "surface-container-lowest": "#ffffff",
                      "tertiary-fixed": "#ffdbcf",
                      "surface-dim": "#d9d9e4",
                      "inverse-on-surface": "#f0f0fb",
                      "tertiary-fixed-dim": "#ffb59b",
                      "on-tertiary-fixed": "#380d00",
                      "surface-tint": "#0c56d0",
                      "on-tertiary": "#ffffff",
                      "on-primary-container": "#c4d2ff",
                      "on-surface-variant": "#434654",
                      "surface": "#faf8ff",
                      "tertiary-container": "#a33500",
                      "on-primary-fixed": "#001848",
                      "on-error": "#ffffff",
                      "primary-fixed": "#dae2ff",
                      "on-tertiary-container": "#ffc6b2",
                      "inverse-surface": "#2e3038",
                      "tertiary": "#7b2600"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "spacing": {
                      "edge-margin": "20px",
                      "stack-gap": "16px",
                      "section-padding": "24px",
                      "inline-gap": "12px"
              },
              "fontFamily": {
                      "headline-lg": [
                              "Manrope"
                      ],
                      "label-md": [
                              "Inter"
                      ],
                      "body-lg": [
                              "Inter"
                      ],
                      "body-md": [
                              "Inter"
                      ],
                      "headline-md": [
                              "Manrope"
                      ],
                      "subtext-sm": [
                              "Inter"
                      ]
              },
              "fontSize": {
                      "headline-lg": [
                              "32px",
                              {
                                      "lineHeight": "40px",
                                      "letterSpacing": "-0.02em",
                                      "fontWeight": "700"
                              }
                      ],
                      "label-md": [
                              "14px",

                                      "lineHeight": "20px",

                              }
                      ],
                      "body-lg": [
                              "18px",

                      "body-md": [

                      ],
                      "headline-md": [
                              "24px",

                                      "letterSpacing": "-0.01em",

                      "subtext-sm": [

</head>
<body class="bg-background min-h-screen flex flex-col items-center pt-16 pb-24 px-edge-margin relative">
<!-- TopAppBar Semantic Shell Placeholder (Suppressed per logic, as this is onboarding) -->
<!-- Content Canvas -->
<main class="w-full max-w-md flex flex-col flex-1 items-center">
<!-- Header Section -->
<header class="flex flex-col items-center text-center mb-10 w-full">
<div class="mb-6 w-16 h-16 flex items-center justify-center rounded-full bg-secondary-container text-primary">
<span class="material-symbols-outlined text-[32px]">favorite</span>
</div>
<h1 class="font-headline-lg text-headline-lg text-primary mb-2">Welcome to Your Recovery.</h1>
<p class="font-body-md text-body-md text-secondary">Select your preferred language to begin.</p>
</header>
<!-- Interaction Area: Language Selection Grid -->
<section class="w-full flex flex-col gap-stack-gap mb-10">
<!-- Active Option: English -->
<button class="w-full flex items-center justify-between p-[20px] rounded-[16px] bg-[#E6F0FF] border-2 border-primary transition-all duration-200" type="button">
<span class="font-body-lg text-body-lg text-primary">English</span>
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</button>
<!-- Inactive Option: Español -->
<button class="w-full flex items-center justify-between p-[20px] rounded-[16px] bg-surface-container-lowest border border-[#DFE1E6] hover:bg-secondary-container/30 transition-all duration-200" type="button">
<span class="font-body-lg text-body-lg text-on-surface">Español</span>
</button>
<!-- Inactive Option: Français -->
<button class="w-full flex items-center justify-between p-[20px] rounded-[16px] bg-surface-container-lowest border border-[#DFE1E6] hover:bg-secondary-container/30 transition-all duration-200" type="button">
<span class="font-body-lg text-body-lg text-on-surface">Français</span>
</button>
<!-- Inactive Option: Mandarin -->
<button class="w-full flex items-center justify-between p-[20px] rounded-[16px] bg-surface-container-lowest border border-[#DFE1E6] hover:bg-secondary-container/30 transition-all duration-200" type="button">
<span class="font-body-lg text-body-lg text-on-surface">中文 (Mandarin)</span>
</button>
</section>
</main>
<!-- Fixed Footer Action -->
<div class="fixed bottom-0 left-0 w-full p-edge-margin bg-background/80 backdrop-blur-sm flex justify-center pb-8 pt-4 border-t border-surface-variant z-10">
<button class="w-full max-w-md h-[56px] rounded-[16px] bg-primary text-on-primary font-label-md text-label-md tracking-wide hover:opacity-90 active:scale-[0.98] transition-all flex items-center justify-center shadow-sm" type="button">
            Continue
        </button>
</div>
</body></html>
